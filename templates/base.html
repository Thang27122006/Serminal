<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Meeting - Hội thảo trực tuyến thời gian thực{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container header-container">
            <a href="/" class="brand-logo">
                <span class="logo-icon">📹</span>
                <span class="logo-text">AI <strong>Meeting</strong></span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Trang chủ</a>
                <a href="/api/v1/health/" target="_blank" class="nav-link">Health Check</a>
                <a href="/admin/" target="_blank" class="nav-link btn-secondary">Quản trị</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="container footer-container">
            <p>© 2026 AI Meeting Platform. Xây dựng với Django Channels, WebRTC Mesh, PostgreSQL & Redis.</p>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
